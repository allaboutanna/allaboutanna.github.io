media:
  input: public/uploads
  output: /uploads
  rename: safe
  extensions: [png, jpg, jpeg, webp, gif]

settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "content: create {path}"
      update: "content: update {path}"
      delete: "content: delete {path}"
      rename: "content: rename {oldPath} -> {newPath}"

content:
  - name: academic
    label: Academic Thinking
    type: collection
    path: src/content/entries/academic
    format: yaml-frontmatter
    subfolders: false
    filename: "{year}-{month}-{day}-{title}.md"
    view:
      fields: [title, date, updated, tags, draft]
      primary: title
      sort: [date, title]
      search: [title, summary, tags, body]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: module
        label: false
        type: string
        hidden: true
        default: academic
      - name: date
        label: Published date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updated
        label: Last updated
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
      - name: summary
        label: Homepage summary
        type: text
        required: true
        description: One or two sentences shown in the Academic Thinking module.
      - name: tags
        label: Tags
        type: string
        list: true
        description: Add any tags you want; they work across all modules.
      - name: status
        label: Status
        type: string
        description: Optional, e.g. Note, Essay, Developing.
      - name: featured
        label: Featured
        type: boolean
        default: false
      - name: order
        label: Manual order
        type: number
        default: 0
        description: Lower numbers appear earlier when other priority rules match.
      - name: draft
        label: Draft
        type: boolean
        default: false
        description: Draft entries are visible locally but excluded from the published build.
      - name: body
        label: Content
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true

